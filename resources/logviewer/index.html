<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PurrPause — Journaux</title>
  <!--
    ============================================================================
    PurrPause remote log console — single self-contained page
    ============================================================================
    Served by the in-service HTTP server (src/remote) at GET /. Vanilla JS +
    CSS, no framework, no CDN — the LAN console is offline by design. Style
    mirrors resources/popup.html (CSS custom properties, system font stack,
    dark surface).

    Flow:
      - On load, GET /api/session -> { authed, hostname, logs:[...] }.
      - Not authed -> pincode form -> POST /api/auth { pin }. On success the
        server sets an HttpOnly session cookie; we re-query /api/session.
      - Authed -> 4 tabs (service / widget / install / watchdog). Service /
        widget / watchdog show a 2-day window (today + yesterday) via GET
        /api/logs?file=X&tail=N plus a live tail via
        EventSource('/api/stream?file=X'); install shows its latest dated file.
        "Télécharger tous les logs" -> GET /api/download?scope=all (zip);
        "Télécharger les 2 derniers jours" -> GET /api/download?scope=window.
        "Déclencher une pause" -> POST /api/pause.
    ============================================================================
  -->
  <style>
    :root {
      --bg: #14161a;
      --surface: #1c1f26;
      --surface-2: #23272f;
      --border: #2e333d;
      --text: #e6e8ec;
      --muted: #9aa1ad;
      --accent: #6aa8ff;
      --accent-hover: #3f8bff;
      --danger: #ff6b6b;
      --ok: #5ec77a;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .hidden { display: none !important; }

    /* --- Login --- */
    #login {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    #login form {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 32px;
      width: 320px;
      max-width: 100%;
      box-shadow: 0 12px 40px rgba(0,0,0,0.35);
    }
    #login h1 { margin: 0 0 4px; font-size: 20px; }
    #login p { margin: 0 0 20px; color: var(--muted); font-size: 13px; }
    #pin {
      width: 100%;
      padding: 12px 14px;
      font-size: 20px;
      letter-spacing: 6px;
      text-align: center;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: var(--mono);
    }
    #pin:focus { outline: none; border-color: var(--accent); }
    #loginError {
      color: var(--danger);
      font-size: 13px;
      min-height: 18px;
      margin: 10px 0 0;
    }

    button {
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      padding: 11px 16px;
      cursor: pointer;
      transition: background 0.12s ease;
    }
    .primary { background: var(--accent); color: #08111f; width: 100%; margin-top: 16px; }
    .primary:hover { background: var(--accent-hover); }
    .ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
    .ghost:hover { background: var(--border); }

    /* --- Console --- */
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    header .brand { font-weight: 700; }
    header .host { color: var(--muted); font-family: var(--mono); font-size: 13px; }
    header .spacer { flex: 1; }
    header .actions { display: flex; gap: 10px; }

    .tabs {
      display: flex;
      gap: 4px;
      padding: 12px 20px 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .tab {
      background: transparent;
      color: var(--muted);
      border: 1px solid transparent;
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      padding: 9px 16px;
    }
    .tab.active {
      color: var(--text);
      background: var(--bg);
      border-color: var(--border);
    }

    #logPane {
      flex: 1;
      margin: 0;
      padding: 14px 20px 60px;
      overflow: auto;
      font-family: var(--mono);
      font-size: 12.5px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    #logPane .line { border-bottom: 1px solid transparent; }
    #logPane .empty { color: var(--muted); font-style: italic; }

    #toast {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }
    #toast.show { opacity: 1; }
    #toast.ok { border-color: var(--ok); }
    #toast.err { border-color: var(--danger); }
  </style>
</head>
<body>
  <!-- Login view -->
  <section id="login" class="hidden">
    <form id="loginForm" autocomplete="off">
      <h1>PurrPause</h1>
      <p>Saisissez le pincode parental pour consulter les journaux.</p>
      <input id="pin" type="password" inputmode="numeric" autocomplete="off"
             aria-label="Pincode" autofocus>
      <p id="loginError" role="alert"></p>
      <button type="submit" class="primary">Déverrouiller</button>
    </form>
  </section>

  <!-- Console view -->
  <section id="console" class="hidden" style="display:flex;flex-direction:column;flex:1;min-height:0;">
    <header>
      <span class="brand">PurrPause</span>
      <span class="host" id="host"></span>
      <span class="spacer"></span>
      <div class="actions">
        <button id="downloadAllBtn" class="ghost">Télécharger tous les logs</button>
        <button id="downloadWindowBtn" class="ghost">Télécharger les 2 derniers jours</button>
        <button id="pauseBtn" class="ghost">Déclencher une pause</button>
      </div>
    </header>
    <nav class="tabs" id="tabs"></nav>
    <pre id="logPane"></pre>
  </section>

  <div id="toast"></div>

  <script>
    "use strict";

    // Display labels for each log param returned by /api/session.
    const LABELS = { service: "Service", widget: "Widget", install: "Install", watchdog: "Watchdog" };
    const HISTORY_TAIL = 500; // lines of the displayed window to load per tab

    const el = (id) => document.getElementById(id);
    let currentFile = null;
    let stream = null; // active EventSource

    function toast(msg, kind) {
      const t = el("toast");
      t.textContent = msg;
      t.className = "show " + (kind || "");
      setTimeout(() => { t.className = t.className.replace("show", "").trim(); }, 2400);
    }

    function show(view) {
      el("login").classList.toggle("hidden", view !== "login");
      el("console").classList.toggle("hidden", view !== "console");
    }

    async function boot() {
      let session;
      try {
        session = await (await fetch("/api/session")).json();
      } catch (e) {
        show("login");
        return;
      }
      if (!session.authed) {
        show("login");
        el("pin").focus();
        return;
      }
      el("host").textContent = session.hostname ? "http://" + session.hostname : "";
      buildTabs(session.logs || Object.keys(LABELS));
      show("console");
    }

    function buildTabs(files) {
      const nav = el("tabs");
      nav.innerHTML = "";
      files.forEach((f, i) => {
        const b = document.createElement("button");
        b.className = "tab" + (i === 0 ? " active" : "");
        b.textContent = LABELS[f] || f;
        b.dataset.file = f;
        b.addEventListener("click", () => selectTab(f));
        nav.appendChild(b);
      });
      if (files.length) selectTab(files[0]);
    }

    function selectTab(file) {
      currentFile = file;
      for (const b of el("tabs").children) {
        b.classList.toggle("active", b.dataset.file === file);
      }
      loadHistory(file);
    }

    function renderLines(lines) {
      const pane = el("logPane");
      pane.innerHTML = "";
      if (!lines.length) {
        const e = document.createElement("div");
        e.className = "empty";
        e.textContent = "(aucune entrée)";
        pane.appendChild(e);
      } else {
        for (const l of lines) appendLine(l, false);
      }
      pane.scrollTop = pane.scrollHeight;
    }

    function appendLine(text, scroll) {
      const pane = el("logPane");
      const empty = pane.querySelector(".empty");
      if (empty) empty.remove();
      const div = document.createElement("div");
      div.className = "line";
      div.textContent = text;
      pane.appendChild(div);
      if (scroll) pane.scrollTop = pane.scrollHeight;
    }

    async function loadHistory(file) {
      if (stream) { stream.close(); stream = null; }
      try {
        const res = await fetch("/api/logs?file=" + encodeURIComponent(file) + "&tail=" + HISTORY_TAIL);
        if (res.status === 401) { show("login"); return; }
        const data = await res.json();
        renderLines(data.lines || []);
      } catch (e) {
        renderLines([]);
      }
      openStream(file);
    }

    function openStream(file) {
      stream = new EventSource("/api/stream?file=" + encodeURIComponent(file));
      stream.onmessage = (ev) => {
        // Ignore events for a tab the user has since switched away from.
        if (file === currentFile) appendLine(ev.data, true);
      };
      stream.onerror = () => { /* browser auto-reconnects */ };
    }

    // --- Login submit ---
    el("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const pin = el("pin").value;
      el("loginError").textContent = "";
      try {
        const res = await fetch("/api/auth", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pin }),
        });
        if (res.ok) {
          el("pin").value = "";
          boot();
        } else if (res.status === 429) {
          el("loginError").textContent = "Trop d'essais — patientez 30 secondes.";
        } else {
          el("loginError").textContent = "Pincode incorrect.";
        }
      } catch (err) {
        el("loginError").textContent = "Erreur réseau.";
      }
    });

    // --- Header actions ---
    el("downloadAllBtn").addEventListener("click", () => {
      window.location.href = "/api/download?scope=all";
    });
    el("downloadWindowBtn").addEventListener("click", () => {
      window.location.href = "/api/download?scope=window";
    });
    el("pauseBtn").addEventListener("click", async () => {
      try {
        const res = await fetch("/api/pause", { method: "POST" });
        if (res.status === 401) { show("login"); return; }
        toast(res.ok ? "Pause déclenchée." : "Échec du déclenchement.", res.ok ? "ok" : "err");
      } catch (e) {
        toast("Erreur réseau.", "err");
      }
    });

    boot();
  </script>
</body>
</html>
